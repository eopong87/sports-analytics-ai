<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer glow circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#brainGrad)" stroke-width="2" opacity="0.3"/>
  <!-- Brain left hemisphere -->
  <path d="M50 25 C35 25 22 35 22 48 C22 55 25 60 30 64 C28 67 28 72 32 74 C32 78 36 80 40 79 C42 83 46 85 50 85"
    fill="none" stroke="url(#brainGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Brain right hemisphere -->
  <path d="M50 25 C65 25 78 35 78 48 C78 55 75 60 70 64 C72 67 72 72 68 74 C68 78 64 80 60 79 C58 83 54 85 50 85"
    fill="none" stroke="url(#brainGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Center line -->
  <line x1="50" y1="25" x2="50" y2="85" stroke="url(#brainGrad)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Neural connections left -->
  <circle cx="33" cy="45" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="28" cy="58" r="2.5" fill="#a855f7" opacity="0.8"/>
  <circle cx="36" cy="68" r="2.5" fill="#a855f7" opacity="0.8"/>
  <!-- Neural connections right -->
  <circle cx="67" cy="45" r="3" fill="#3b82f6" opacity="0.8"/>
  <circle cx="72" cy="58" r="2.5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="64" cy="68" r="2.5" fill="#3b82f6" opacity="0.8"/>
  <!-- Pulse dots center -->
  <circle cx="50" cy="40" r="3" fill="url(#brainGrad)"/>
  <circle cx="50" cy="55" r="3" fill="url(#brainGrad)"/>
  <circle cx="50" cy="70" r="3" fill="url(#brainGrad)"/>
  <!-- Connection lines -->
  <line x1="33" y1="45" x2="50" y2="40" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="28" y1="58" x2="50" y2="55" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="36" y1="68" x2="50" y2="70" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <line x1="67" y1="45" x2="50" y2="40" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="72" y1="58" x2="50" y2="55" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="64" y1="68" x2="50" y2="70" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
</svg>